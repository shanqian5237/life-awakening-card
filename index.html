<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dfeee3" />
    <title>常青生命觉醒卡 · 在线抽卡系统 1.0</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <section class="screen access-screen is-active" id="accessScreen">
        <div class="access-panel">
          <p class="system-label">专属访问</p>
          <h1>常青生命觉醒卡</h1>
          <p class="subtitle">请输入专属访问码，开启你的今日抽卡。</p>

          <form class="access-form" id="accessForm">
            <label class="access-label" for="accessCode">访问码</label>
            <input
              class="access-input"
              id="accessCode"
              type="password"
              inputmode="text"
              autocomplete="one-time-code"
              placeholder="请输入访问码"
              required
            />
            <p class="access-error" id="accessError" role="alert"></p>
            <button class="primary-button" type="submit">进入抽卡</button>
          </form>
        </div>
      </section>

      <section class="screen home-screen" id="homeScreen">
        <div class="brand-block">
          <p class="system-label">在线抽卡系统 1.0</p>
          <h1>常青生命觉醒卡</h1>
          <p class="subtitle">抽一张卡，听见此刻生命给你的提醒</p>
        </div>

        <div class="card-stage" id="cardStage">
          <img
            class="card-image"
            id="homeCard"
            src="牌样/cardback.jpg"
            alt="常青生命觉醒卡背面"
          />
        </div>

        <button class="primary-button" id="drawButton" type="button">开始抽卡</button>
        <p class="quiet-tip">请静下心来，在心里默念一个你想探索的问题。</p>
      </section>

      <section class="screen result-screen" id="resultScreen">
        <div class="result-card-wrap">
          <img class="result-card-image" id="resultImage" src="牌样/cardback.jpg" alt="抽到的生命觉醒卡" />
        </div>

        <div class="reading-panel">
          <p class="result-kicker" id="cardNumber">今日觉醒卡：第 1 张</p>
          <h2 id="keywordTitle">关键词：觉察</h2>
          <p class="guidance" id="guidanceText"></p>
        </div>

        <div class="action-row">
          <button class="secondary-button" id="resetButton" type="button">重新抽卡</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
